<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e0e">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spypaper">
<meta name="referrer" content="no-referrer">
<title>Spypaper Remote</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="bar" id="bar">
  <button class="icon-btn" id="back" hidden aria-label="Geri"></button>
  <img class="logo" src="/icon.svg" alt="" width="28" height="28">
  <div class="bar-title">
    <div id="title">Spypaper Remote</div>
    <div id="subtitle" class="muted small"></div>
  </div>
  <button class="icon-btn" id="logout" hidden aria-label="Çıkış"></button>
</header>
<div id="banner" class="banner" hidden></div>
<main id="view" aria-live="polite"></main>
<div id="modal" class="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <div id="m-title" class="sheet-title"></div>
    <div id="m-text" class="muted"></div>
    <input id="m-input" type="password" inputmode="numeric" autocomplete="off" hidden>
    <div class="row end">
      <button id="m-cancel" class="btn ghost"></button>
      <button id="m-ok" class="btn primary"></button>
    </div>
  </div>
</div>
<script src="/app.js"></script>
</body>
</html>
